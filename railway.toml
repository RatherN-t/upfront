# Railway / Nixpacks — single service: build SPA, run FastAPI.
[build]
builder = "NIXPACKS"
buildCommand = "cd webapp/frontend && npm ci && npm run build && cd ../.. && pip install -r requirements.txt"

[deploy]
startCommand = "python -m uvicorn main:app --app-dir webapp/api --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
